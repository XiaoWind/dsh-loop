# dsh-loop bundle layer
#
# A DSH bundle exports a top-level YAML array of include PatchOptions. This
# file inserts one entry (this package itself) into the booted profile's
# composition. The entry is a Cordis function plugin (lib/index.js) that
# registers the human-facing `/loop` slash command.
#
# The plugin injects the `commands` service, so it activates only in profiles
# that compose a command adapter (the shipped `web` profile does). Set
# `config.defaultIntervalMs` to change the interval used by a bare
# `/loop <objective>` (an objective with no leading duration token).
- insert:
    - id: loop
      name: dsh-loop
      config:
        # Interval used when `/loop <objective>` has no leading duration
        # token. Milliseconds; default 10 minutes.
        defaultIntervalMs: 600000
